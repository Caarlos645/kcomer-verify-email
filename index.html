<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Verificar email | KComer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    p {
      font-size: 14px;
      color: #555;
    }

    .success {
      color: #2e7d32;
    }

    .error {
      color: #e53935;
    }
  </style>
</head>

<body>

<div class="card" id="card">
  <h2>Verificando email...</h2>
  <p>Por favor, espera un momento.</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const card = document.getElementById("card");

  if (!token) {
    card.innerHTML = `
      <h2 class="error">Enlace inválido</h2>
      <p>El enlace de verificación no es correcto.</p>
    `;
  } else {
    verifyEmail(token);
  }

  async function verifyEmail(token) {
    try {
      // Cambiar a URL de producción cuando toque
      const res = await fetch(
        `http://localhost:8080/api/v1/auth/verify-email?token=${token}`
      );

      if (res.ok) {
        card.innerHTML = `
          <h2 class="success">Email verificado</h2>
          <p class="success">
            Tu email ha sido verificado correctamente.
          </p>
          <p class="success">
            Ya puedes volver a la app e iniciar sesión.
          </p>
        `;
      } else {
        card.innerHTML = `
          <h2 class="error">Enlace no válido</h2>
          <p>Este enlace ha expirado o ya fue utilizado.</p>
        `;
      }
    } catch (e) {
      card.innerHTML = `
        <h2 class="error">Error de conexión</h2>
        <p>No se pudo conectar con el servidor.</p>
      `;
    }
  }
</script>

</body>
</html>
